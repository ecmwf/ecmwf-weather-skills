version = 1

# Human-facing LICENSE and NOTICE live outside LICENSES/.
[[annotations]]
path = ["LICENSE", "NOTICE", "CONTRIBUTORS", "plugins/ecmwf-weather/LICENSE"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 European Centre for Medium-Range Weather Forecasts (ECMWF)"
SPDX-License-Identifier = "Apache-2.0"

# Files that cannot carry a comment: recorded test fixtures, JSON (manifests, eval cases,
# lock file), generated references are Markdown and carry their own header.
[[annotations]]
path = ["tests/fixtures/**", "**/*.json", "uv.lock", "**/*.png"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 European Centre for Medium-Range Weather Forecasts (ECMWF)"
SPDX-License-Identifier = "Apache-2.0"

# ECMWF logo: trademark, used with ECMWF approval; not Apache-2.0.
[[annotations]]
path = ["plugins/ecmwf-weather/assets/ecmwf-logo.svg", "plugins/ecmwf-weather/assets/ecmwf-icon.png"]
precedence = "override"
SPDX-FileCopyrightText = "European Centre for Medium-Range Weather Forecasts (ECMWF)"
SPDX-License-Identifier = "LicenseRef-ECMWF-Logo"

# Upstream issue reproducers are pasted verbatim into GitHub issues; kept header-free.
[[annotations]]
path = ["docs/upstream/*.py"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 European Centre for Medium-Range Weather Forecasts (ECMWF)"
SPDX-License-Identifier = "Apache-2.0"
