#
# Third-party actions are pinned to full commit SHAs (ecmwf/codex audit guidance); the
# comment names the release each SHA belongs to.
name: skill-evals
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "space-separated case ids (empty = all)"
        required: false
      model:
        description: "haiku | sonnet | opus"
        default: sonnet
permissions:
  contents: read
jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Fresh agent, plugin only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_BARE: "1"
        run: make evals AGENT=claude MODEL="${{ inputs.model }}" CASES="${{ inputs.cases }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: eval-runs, path: evals/runs/ }
