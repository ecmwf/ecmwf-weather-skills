name: tests
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Packaging and skill lint
        run: |
          python3 scripts/validate_packaging.py
          python3 scripts/check_skills.py
      - name: Unit tests (offline)
        run: uv run pytest -q
  earthkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: earthkit-backed tests (offline fixtures)
        run: uv run --group earthkit pytest -q -m "earthkit and not live"
        env:
          MIR_CACHE_PATH: ${{ runner.temp }}/mir
