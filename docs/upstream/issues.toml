[[issue]]
script = "transforms-spatial-reduce-0-360.py"
repo = "ecmwf/earthkit-transforms"
kind = "bug"
status = "filed"
url = "https://github.com/ecmwf/earthkit-transforms/issues/133"
title = "spatial.reduce returns NaN for western-hemisphere polygons when longitudes run 0-360"
expected = "The same mean as with -180..180 longitudes (1.0 in the reproducer)."
actual = "NaN — ECMWF GRIB on 0..360 grids gives NaN for any polygon west of Greenwich."
suggestion = "Normalise polygon or grid longitudes to the same convention before masking."
workaround = "da.assign_coords(longitude=((da.longitude + 180) % 360) - 180).sortby('longitude')."

[[issue]]
script = "transforms-spatial-reduce-return-as-pandas.py"
repo = "ecmwf/earthkit-transforms"
kind = "bug"
status = "filed"
url = "https://github.com/ecmwf/earthkit-transforms/issues/134"
title = "spatial.reduce(..., return_as='pandas') crashes (return_as passed on to nanmean)"
expected = "A pandas DataFrame, as documented."
actual = "TypeError: nanmean() got an unexpected keyword argument 'return_as'."
suggestion = "Pop return_as before forwarding kwargs to the reduction."
workaround = "Reduce to xarray, then .to_dataframe()."

[[issue]]
