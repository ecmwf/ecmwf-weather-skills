[[issue]]
script = "plots-timeseries-quantiles-xarray.py"
repo = "ecmwf/earthkit-plots"
kind = "bug"
status = "filed"
url = "https://github.com/ecmwf/earthkit-plots/issues/262"
title = "TimeSeries.quantiles fails on a (member, time) DataArray"
expected = "Quantile bands over the member dimension."
actual = "ValueError: 'x' is not 1-dimensional."
