# status: draft | filed (add url) | fixed (add version)

[[issue]]
script = "meteo-wet-bulb-bisect-2d.py"
repo = "ecmwf/earthkit-meteo"
kind = "bug"
status = "filed"
url = "https://github.com/ecmwf/earthkit-meteo/issues/212"
title = "thermo.wet_bulb_temperature_from_dewpoint: default t_method='bisect' fails on 2-D input"
expected = "Same result as t_method='newton' for 2-D/3-D numpy and xarray inputs."
actual = "ValueError: operands could not be broadcast together with shapes (3,4) (12,)."
suggestion = "The bisect path flattens one operand but not the others; reshape consistently (or apply np.broadcast_arrays first)."
workaround = "Pass t_method='newton'."

[[issue]]
script = "meteo-scores-extra-name.py"
repo = "ecmwf/earthkit-meteo"
kind = "bug"
status = "filed"
url = "https://github.com/ecmwf/earthkit-meteo/issues/213"
title = "score: error message names a non-existent 'earthkit-meteo[score]' extra (it is [scores])"
expected = "The message points to `pip install earthkit-meteo[scores]`."
actual = "'The earthkit-meteo[score] extra is required ... pip install earthkit-meteo[score]'; pip then installs nothing extra."
suggestion = "Fix the extra name in the RuntimeError message."
workaround = "pip install 'earthkit-meteo[scores]'."

[[issue]]
script = "meteo-xarray-output-keeps-input-name.py"
repo = "ecmwf/earthkit-meteo"
kind = "bug"
status = "filed"
url = "https://github.com/ecmwf/earthkit-meteo/issues/214"
title = "xarray results keep the first input's name and long_name (relative humidity named '2t')"
expected = "Output named and described for the computed quantity (e.g. name 'r', long_name 'relative humidity'), as the FieldList path already does."
actual = "name '2t', long_name '2 metre temperature', units '%', standard_name 'relative_humidity'."
suggestion = "Set name/long_name in the xarray dispatcher from the same metadata used for FieldList outputs."
workaround = "Rename and reset attributes on the result."

[[issue]]
script = "plots-spaghetti-xarray.py"
repo = "ecmwf/earthkit-plots"
kind = "bug"
status = "filed"
url = "https://github.com/ecmwf/earthkit-plots/issues/260"
title = "geo.spaghetti rejects an ensemble DataArray despite documenting xarray input; error message unformatted"
expected = "One contour per member of a (member, latitude, longitude) DataArray, as for a FieldList."
actual = "ValueError 'Invalid shape for selection ... got sizes {self.selection.shape}' (the f-string prefix is missing)."
suggestion = "Iterate over the non-spatial dimension for xarray input; add the f prefix to the message."
workaround = "Pass a FieldList (earthkit-data) instead of xarray."

[[issue]]
script = "plots-quickplot-doc-ekp-plot.py"
