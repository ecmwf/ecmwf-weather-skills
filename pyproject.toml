# Development-only config (tests, evals). Not part of the shipped plugin.
[project]
name = "ecmwf-weather-skills-dev"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
# Mirrors the PEP 723 bundles declared in the skill scripts (keep in sync).
earthkit = [
    "earthkit-data[ecmwf-opendata]>=1.2",
    "earthkit-geo>=1.1",
    "earthkit-meteo>=1.2",
    "earthkit-utils>=1.0",
    "earthkit-transforms[all]>=1.0",
    "earthkit-plots>=1.0",
    "scipy>=1.16",
    "thermofeel>=2.3",
    # ecmwf-observations obs.py: MARS observations (ODB feedback, BUFR) and thermal indices
    "ecmwf-api-client>=1.6",
    "pyodc>=1.6",
    "pdbufr>=0.15",
    "earthkit-meteo[scores]>=1.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown code blocks in skill references are kept deliberately compact (agent token budget);
# ruff is for the Python sources only.
extend-exclude = ["evals/runs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo tooling and every skill's scripts are importable by name in tests (they are standalone
# scripts, not packages; at runtime Python puts each script's own directory on sys.path).
pythonpath = [
    "tests",
    "scripts",
    "plugins/ecmwf-weather/skills/ecmwf-open-data/scripts",
    "plugins/ecmwf-weather/skills/ecmwf-destine/scripts",
]
addopts = "-m 'not live and not earthkit' -ra"
markers = [
    "live: hits real ECMWF services (run with -m live)",
    "earthkit: needs earthkit components installed (run with --group earthkit -m earthkit)",
]
